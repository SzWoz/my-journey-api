default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: password
  host: localhost
  port: 5433

development:
  <<: *default
  database: my_journey_development

test:
  <<: *default
  database: myapp_test

# change it when deployed
production:
  <<: *default
  database: my_journey_development
  username: postgres
  password: password
